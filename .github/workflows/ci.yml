name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            global.json
      - name: Restaurar
        run: |
          dotnet restore src/SoundDeck.App/SoundDeck.App.csproj -p:Platform=x64 -r win-x64
          dotnet restore tests/SoundDeck.Tests/SoundDeck.Tests.csproj
      - name: Probar
        run: dotnet test tests/SoundDeck.Tests/SoundDeck.Tests.csproj --configuration Release --no-restore --logger trx
      - name: Compilar
        run: dotnet build src/SoundDeck.App/SoundDeck.App.csproj --configuration Release --no-restore -p:Platform=x64 -r win-x64
      - name: Publicar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/*.trx"
          if-no-files-found: ignore
